[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fail the build on any compiler warning.
deny = "warnings"

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 32

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
