name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit & integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: Migrations on real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eoi
          POSTGRES_PASSWORD: eoi
          POSTGRES_DB: eoi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eoi -d eoi" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://eoi:eoi@localhost:5432/eoi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit/integration tests use PGlite; this proves the same migrations apply to a
      # real server and are idempotent when re-run.
      - run: npm run db:migrate
      - run: npm run db:migrate
      - name: Schema drift check (migrations match schema.ts)
        # drizzle-kit is called directly: nested `npm run` would swallow `--name`.
        working-directory: packages/database
        run: |
          npx drizzle-kit generate --name drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "schema.ts changed without a committed migration"; git status --porcelain; exit 1
          fi

  contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Boot the stack and wait for readiness
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ready >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              echo "stack is ready"; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs --tail=100; exit 1
      - if: always()
        run: docker compose down -v
