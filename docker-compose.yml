# Full stack: PostgreSQL, migrations, indexer, API and web.
#   docker compose up --build
# Then open http://localhost:3000. Configuration is read from .env (see .env.example);
# every variable has a working default for Ethereum Sepolia.

x-backend-env: &backend-env
  DATABASE_URL: postgres://eoi:${POSTGRES_PASSWORD:-eoi}@postgres:5432/eoi
  ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
  ETHEREUM_CHAIN_ID: ${ETHEREUM_CHAIN_ID:-11155111}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RPC_MAX_REQUESTS_PER_SECOND: ${RPC_MAX_REQUESTS_PER_SECOND:-10}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eoi
      POSTGRES_USER: eoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eoi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published by default: only the backend containers need it.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eoi -d eoi']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: indexer
    command: ['node', 'dist/migrate.js']
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  indexer:
    build:
      context: .
      target: indexer
    environment:
      <<: *backend-env
      CONFIRMATIONS: ${CONFIRMATIONS:-12}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:--500}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-10}
      INDEXER_FETCH_CONCURRENCY: ${INDEXER_FETCH_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # SIGTERM lets the in-flight batch commit or roll back before exit.
    stop_grace_period: 30s

  api:
    build:
      context: .
      target: api
    environment:
      <<: *backend-env
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENS_RPC_URL: ${ENS_RPC_URL:-}
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
